<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>CC Generator</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 70vw;
            height: 80vh;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <script type='text/javascript'>
        var canvasElement = document.getElementById('canvas');

        canvasElement.addEventListener('webglcontextlost', (e) => {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
        }, false);

        var Module = { canvas: canvasElement };
    </script>
    <script async type="text/javascript" src="CC_Generator_GUI.js"></script>
</body>

</html>
